<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行途排版 · md2wechat v2.2.2</title>
<style>
:root{
  --main:#056DE8;
  --main-light:#0099ff;
  --main-dark:#0052b3;
  --main-bg:rgba(5,109,232,0.08);
  --main-bg-focus:rgba(5,109,232,0.12);
  --main-shadow:rgba(5,109,232,0.25);
  --main-shadow-hover:rgba(5,109,232,0.35);
  --main-shadow-logo:rgba(5,109,232,0.30);
  --bg:#f5f5f7;
  --panel:rgba(255,255,255,0.72);
  --panel-solid:#ffffff;
  --ink:#1d1d1f;
  --mut:#86868b;
  --line:rgba(0,0,0,0.08);
  --hover:rgba(0,0,0,0.04);
  --success:#34c759;
  --warning:#ff9500;
  --danger:#ff3b30;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
select,input{font-family:inherit}
svg{display:block;flex-shrink:0}

/* ============ 顶栏（毛玻璃） ============ */
.topbar{
  height:52px;
  background:var(--panel);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
  padding:0 20px;
  position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.2px}
.brand .logo{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--main),var(--main-light));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 2px 8px var(--main-shadow-logo);
}
.brand small{color:var(--mut);font-weight:500;font-size:11px;margin-left:2px}
.title-in{
  flex:1;max-width:300px;min-width:120px;
  border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;font-size:13px;outline:none;
  background:rgba(255,255,255,0.8);
  transition:border-color .2s,box-shadow .2s;
}
.title-in:focus{border-color:var(--main);box-shadow:0 0 0 3px var(--main-bg-focus)}
.spacer{flex:1}
.icon-btn{
  display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:rgba(255,255,255,0.8);
  border-radius:10px;padding:7px 12px;font-size:13px;color:#444;
  transition:all .15s;
}
.icon-btn:hover{background:#fff;border-color:rgba(0,0,0,0.15)}
.icon-btn.active{border-color:var(--main);color:var(--main);background:var(--main-bg)}
.copy-btn{
  display:flex;align-items:center;gap:7px;
  border:none;border-radius:10px;padding:8px 18px;
  font-size:13.5px;font-weight:600;
  background:var(--main);color:#fff;
  box-shadow:0 2px 8px var(--main-shadow);
  transition:all .15s;
}
.copy-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--main-shadow-hover)}
.copy-btn:active{transform:translateY(0)}
.copy-btn .kbd{
  font-size:10px;background:rgba(255,255,255,.2);
  padding:2px 6px;border-radius:4px;font-weight:500;
}

/* ============ 主体 ============ */
.main{display:grid;grid-template-columns:1fr 1fr;height:calc(100% - 52px);gap:0}
.pane{display:flex;flex-direction:column;min-width:0}
.editor-pane{border-right:1px solid var(--line);background:var(--panel-solid)}
.pane-head{
  height:36px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:11px;color:var(--mut);font-weight:500;
  letter-spacing:.3px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,0.5);
}
.pane-head .hint{color:#b0b0b5;font-weight:400}
.tool-mini{display:flex;gap:4px}
.tool-mini button{
  display:flex;align-items:center;gap:5px;
  background:transparent;border:none;color:var(--mut);
  border-radius:6px;padding:4px 10px;font-size:11px;
  transition:all .15s;
}
.tool-mini button:hover{background:var(--hover);color:var(--ink)}
#editor{
  flex:1;border:none;outline:none;resize:none;
  background:transparent;color:var(--ink);
  font-family:"SF Mono",Menlo,Monaco,Consolas,"Courier New",monospace;
  font-size:13px;line-height:1.75;padding:18px 20px;tab-size:2;
}
.pane-status{
  height:28px;border-top:1px solid var(--line);
  color:var(--mut);font-size:11px;
  display:flex;align-items:center;padding:0 16px;gap:14px;
  background:rgba(255,255,255,0.5);
}

/* 预览侧 */
.preview-pane{
  background:var(--bg);
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:32px 24px 80px;
}
.preview-inner{width:100%;max-width:460px;margin:0 auto}
.phone{
  width:100%;background:#fff;
  border-radius:18px;
  box-shadow:0 4px 24px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  overflow:hidden;
  border:1px solid rgba(0,0,0,0.04);
}
.phone .ph-title{padding:22px 24px 4px;font-size:17px;font-weight:700;line-height:1.5;text-align:center;color:var(--ink);letter-spacing:-.2px}
.phone .ph-meta{display:flex;align-items:center;gap:8px;padding:10px 24px 16px;justify-content:center}
.phone .ph-meta .avatar{
  width:20px;height:20px;border-radius:50%;
  background:linear-gradient(135deg,var(--main),var(--main-light));
  flex-shrink:0;
}
.phone .ph-meta .author{font-size:11px;color:var(--mut)}
.phone .ph-body{padding:10px 24px 44px;border-top:1px solid #f5f5f7}
#content{min-height:120px}
.preview-empty{color:var(--mut);text-align:center;padding:60px 20px;font-size:14px}

/* 宽屏模式 */
.preview-pane.wide .preview-inner{max-width:780px}
.preview-pane.wide .phone .ph-title{text-align:left}
.preview-pane.wide .phone .ph-meta{justify-content:flex-start;padding-left:28px}

/* ============ 弹出面板（毛玻璃） ============ */
.pop{
  position:absolute;top:58px;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  padding:16px;
  display:none;z-index:40;
  max-height:calc(100vh - 80px);
  overflow-y:auto;
  overflow-x:hidden;
}
.pop::-webkit-scrollbar{width:6px}
.pop::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:3px}
.pop::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.25)}
.pop.show{display:block}
.pop-title{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--ink);display:flex;align-items:center;gap:8px}
.tp-group{margin-bottom:12px}
.tp-group-name{font-size:10px;color:var(--mut);font-weight:600;letter-spacing:1px;margin-bottom:7px;text-transform:uppercase}
.tp-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tp-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,0.6);
  font-size:12.5px;font-weight:500;text-align:left;
  transition:all .15s;color:var(--ink);
}
.tp-item:hover{border-color:rgba(0,0,0,0.15);background:#fff}
.tp-item.active{border-color:var(--main);background:var(--main-bg);color:var(--main)}
.tp-item .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tp-item .tp-desc{font-size:10px;color:var(--mut);font-weight:400;display:block;line-height:1.3;margin-top:1px}
.tp-adv{
  border-top:1px dashed var(--line);
  margin-top:8px;padding-top:12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.tp-adv label{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.tp-adv select{
  border:1px solid var(--line);border-radius:7px;
  padding:4px 6px;font-size:11px;background:rgba(255,255,255,0.8);
  outline:none;
}
.color-box{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);border-radius:8px;
  padding:3px 10px;font-size:11px;background:rgba(255,255,255,0.8);
}
.color-box input[type=color]{width:20px;height:20px;border:none;background:none;padding:0;cursor:pointer;border-radius:4px}
#customColorValue{font-family:"SF Mono",Menlo,monospace;color:var(--mut);min-width:62px}
.tp-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.tp-actions button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid var(--line);background:rgba(255,255,255,0.6);
  border-radius:8px;padding:6px 10px;font-size:11px;color:var(--ink);
  transition:all .15s;
}
.tp-actions button:hover{background:#fff;border-color:rgba(0,0,0,0.15)}

/* ============ 发布检查清单 ============ */
.checklist{width:320px;right:20px}
.check-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--line);
}
.check-item:last-child{border-bottom:none}
.check-icon{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.check-content{flex:1;min-width:0}
.check-label{font-size:12.5px;font-weight:600;color:var(--ink)}
.check-desc{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.4}
.check-value{font-size:11px;font-weight:600;font-family:"SF Mono",Menlo,monospace;margin-top:2px}
.check-value.ok{color:var(--success)}
.check-value.warn{color:var(--warning)}
.check-value.info{color:var(--main)}
.check-footer{
  margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:11px;color:var(--mut);line-height:1.5;
}
.check-footer strong{color:var(--ink)}

/* ============ Toast ============ */
.toast{
  position:fixed;bottom:32px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:rgba(29,29,31,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  color:#fff;font-size:13px;
  padding:12px 24px;border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.2);
  transition:all .3s cubic-bezier(.4,0,.2,1);
  opacity:0;z-index:60;
  font-weight:500;
  display:flex;align-items:center;gap:8px;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* 滚动条美化 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.25)}

@media(max-width:980px){
  .main{grid-template-columns:1fr;overflow:auto}
  .editor-pane{min-height:45vh;border-right:none;border-bottom:1px solid var(--line)}
  .pop{right:16px;width:min(380px,calc(100vw - 32px))}
  .topbar .title-in{display:none}
  .icon-btn .btn-text{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">途</div>
    行途排版
    <small>md2wechat v2.2.2</small>
  </div>
  <input class="title-in" id="titleIn" placeholder="文章标题（公众号标题单独填）">
  <div class="spacer"></div>

  <button class="icon-btn" id="themeBtn" onclick="toggleThemePop(event)">
    <svg width="15" height="15"><use href="#icon-palette"/></svg>
    <span class="btn-text" id="themeBtnText">行途蓝</span>
    <span style="opacity:.4;font-size:10px">▾</span>
  </button>

  <button class="icon-btn active" id="viewBtn" onclick="toggleView()">
    <svg width="15" height="15" id="viewIcon"><use href="#icon-smartphone"/></svg>
    <span class="btn-text" id="viewBtnText">手机预览</span>
  </button>

  <button class="icon-btn" id="checkBtn" onclick="toggleCheckPop(event)">
    <svg width="15" height="15"><use href="#icon-checklist"/></svg>
    <span class="btn-text">发布检查</span>
  </button>

  <button class="copy-btn" onclick="copyToClipboard()">
    <svg width="15" height="15"><use href="#icon-copy"/></svg>
    复制到公众号
    <span class="kbd">⌘↵</span>
  </button>
</div>

<!-- 主题面板 -->
<div class="pop" id="themePop" style="right:280px;width:380px">
  <div class="pop-title">
    <svg width="15" height="15"><use href="#icon-palette"/></svg>
    选择主题
  </div>
  <div id="tpBody"></div>
  <div class="tp-adv">
    <label>正文图片
      <select id="optImages" onchange="renderPreview()">
        <option value="placeholder" title="输出占位卡，在公众号后台手动上传（最稳妥，支持本地图片）">占位卡（推荐）</option>
        <option value="keep" title="输出真实 img 标签，http(s) 外链图公众号会自动上传到素材库；本地路径不支持">外链自动上传</option>
        <option value="drop">忽略</option>
      </select>
    </label>
    <label>外链
      <select id="optLinks" onchange="renderPreview()">
        <option value="text">文字+角标（推荐）</option>
        <option value="keep">保留链接</option>
        <option value="drop">仅文字</option>
      </select>
    </label>
    <label>文末声明 <input type="checkbox" id="optFooter" checked onchange="renderPreview()"></label>
    <div class="color-box">主色
      <input type="color" id="customColor" value="#056DE8" onchange="applyCustomColor(this.value)">
      <span id="customColorValue">#056DE8</span>
    </div>
  </div>
  <div class="tp-actions">
    <button onclick="exportTheme()">
      <svg width="13" height="13"><use href="#icon-download"/></svg>
      导出主题
    </button>
    <button onclick="importTheme()">
      <svg width="13" height="13"><use href="#icon-upload"/></svg>
      导入主题
    </button>

  </div>

<script>
/**
 * md2wechat engine v2.0
 * 行途排版引擎核心：Markdown → 微信公众号内联样式 HTML

        + it.marker + inline(it.text, S, t, opts) + '</p>';
    }).join('');
    return { html: html, next: next, count: items.length };
  }

  /* ==================== 媒体占位 / 段落 ==================== */

  function isMediaPlaceholder(line) {
    // 支持 [视频：x] / [音频：x]
    let m = line.match(/^\[(视频|音频)：(.*)\]$/);
    if (m) return { type: m[1], title: m[2] };
    // 支持 【配图：x.png】（行途自定义配图占位语法）
    m = line.match(/^【配图：(.*)】$/);
    if (m) return { type: '配图', title: m[1] };
    return null;
  }

  /* ==================== 主渲染 ==================== */

  // 分离 footer：最后一个独立行 --- 之后为 footer（公众号文末声明区）
  // v2.2.1 修复：仅当分隔线之后是「纯文本声明」（无标题/列表/表格/代码块/引用）时才算 footer，
  // 否则该 --- 只是章节分隔线（正文用 --- 分章时，旧逻辑会把后半篇正文整体劫持成 footer）。
  function splitFooter(md) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    const BLOCKY = /^(#{1,6}\s|```|\s*[-*+]\s|\s*\d+[.)]\s|\||>)/;
    // 找最后一个既是 --- 又前后有空行/边界、且之后无块级结构的行
    for (let i = lines.length - 1; i >= 0; i--) {
      if (/^---+$/.test(lines[i].trim())) {
        const beforeOk = i === 0 || /^\s*$/.test(lines[i - 1]);
        const afterOk = i === lines.length - 1 || /^\s*$/.test(lines[i + 1]);
        if (beforeOk && afterOk && i > 2) {
          const after = lines.slice(i + 1);
          const structured = after.some(function (l) { return BLOCKY.test(l); });
          if (!structured) {
            return {
              main: lines.slice(0, i).join('\n'),
              footer: after.join('\n'),
            };
          }
        }
      }
    }
    return { main: md, footer: '' };
  }

  function render(md, opts) {
    opts = opts || {};
    const tid = THEME_ALIASES[opts.theme] || opts.theme || 'byte';
    const t = themeTokens(tid);
    if (opts.color) { t.main = opts.color; }
    const S = stylesOf(t);
    const useFooter = opts.footer !== false;
    opts._imgCounter = { index: 0 };
    opts._h2Counter = { index: 0 };

    // v2.2.1：剥离 HTML 注释（如文末「搜一搜关键词」元信息，不应对读者显示）
    md = String(md).replace(/<![\s\S]*?-->/g, '');

    let title = opts.title || '';
    let mainText = md;
    let footerText = '';

    if (useFooter) {
      const sp = splitFooter(md);
      mainText = sp.main;
      footerText = sp.footer.trim();
    }

    // 提取标题：首个 # H1（公众号标题单独填，正文剥离但可提取）
    const h1m = mainText.match(/^#\s+(.+)$/m);
    if (!title && h1m) title = h1m[1].trim();
    // 剥离 frontmatter（--- 起头的键值块）
    mainText = mainText.replace(/^\s*---[\s\S]*?---\s*\n?/, '');

    // 统计 H2 总数（供 techprog 分段进度条按章节占比点亮）
    opts._h2Total = (mainText.match(/^##\s+/gm) || []).length;

    // 提取引子文案：首个 > blockquote（供引子图占位卡自动填充设计参考）
    const firstQuote = mainText.match(/^>\s?(.+)$/m);
    opts._heroInfo = {
      title: title,
      intro: firstQuote ? firstQuote[1].trim() : ''
    };

    const lines = mainText.replace(/\r\n/g, '\n').split('\n');
    const out = [];
    let i = 0;
    let h1Seen = false; // 首个 H1 = 文章标题（剥离）；后续 H1 = 文末小节标签（渲染）

    while (i < lines.length) {
      const line = lines[i];
      if (/^\s*$/.test(line)) { i++; continue; }

      // 标题
      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      if (hm) {
        const lv = hm[1].length;
        const body = inline(hm[2], S, t, opts);
        if (lv === 1) {
          // v2.2.1：首个 H1 由公众号标题承担；后续 H1（如文末四段式「关于行途」）渲染为小节标签
          if (!h1Seen) { h1Seen = true; i++; continue; }
          out.push('<h3 style="' + S.h1Later + '">' + body + '</h3>');
          i++; continue;
        }
        if (lv === 2) {
          if (t.h2 === 'center') out.push('<div style="' + S.h2CenterWrap + '"><h2 style="' + S.h2 + '">' + body + '</h2></div>');
          else if (t.h2 === 'symbol') out.push('<h2 style="' + S.h2 + '"><span style="color:' + t.main + ';margin-right:8px;font-weight:bold;">▐</span>' + body + '</h2>');
          else if (t.h2 === 'number') {
            const n = ++opts._h2Counter.index;
            const pad = n < 10 ? '0' + n : '' + n;
            out.push('<h2 style="' + S.h2 + '"><span style="font-family:Georgia,\'Times New Roman\',serif;font-size:36px;font-weight:400;color:' + t.main + ';line-height:1;letter-spacing:-1px;">' + pad + '</span><span>' + body + '</span></h2>');
          }
          else if (t.h2 === 'techprog') {
            const n = ++opts._h2Counter.index;
            const total = Math.max(opts._h2Total || n, n);
            let segs = '';
            for (let k = 1; k <= total; k++) {
              segs += '<span style="flex:1;height:5px;border-radius:3px;background:' + (k <= n ? t.main : '#e8eaed') + ';display:block;"></span>';
            }
            out.push('<div style="margin:44px 0 24px;"><div style="display:flex;align-items:center;gap:12px;"><span style="font-size:34px;font-weight:900;line-height:1;color:' + t.main + ';">' + n + '</span><div style="flex:1;display:flex;gap:5px;">' + segs + '</div></div><div style="font-size:18px;font-weight:bold;line-height:1.6;margin-top:10px;color:' + t.main + ';">' + body + '</div></div>');
          }
          else out.push('<h2 style="' + S.h2 + '">' + body + '</h2>');
        } else if (lv === 3) out.push('<h3 style="' + S.h3 + '">' + body + '</h3>');
        else out.push('<h4 style="' + S.h4 + '">' + body + '</h4>');
        i++; continue;
      }

      // 代码块（围栏）
      if (/^```/.test(line)) {
        const lang = line.replace(/^```/, '').trim();
        const buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        if (i < lines.length) i++;
        const codeHtml = esc(buf.join('\n'));
        const dots = S.preDots
          ? '<span style="color:' + t.dotRed + ';font-size:12px;margin-right:4px;line-height:1;">●</span><span style="color:' + t.dotYellow + ';font-size:12px;margin-right:4px;line-height:1;">●</span><span style="color:' + t.dotGreen + ';font-size:12px;line-height:1;">●</span>'
          : '';
        const langHtml = lang ? '<span style="color:#7a828e;font-size:11px;margin-left:auto;">' + esc(lang) + '</span>' : '';
        out.push(
          '<section style="' + S.preWrap + ';overflow:hidden;">' +
          '<div style="display:flex;align-items:center;padding:7px 12px;' + S.preHeader + ';">' + dots + langHtml + '</div>' +
          '<pre style="' + S.pre + '"><code style="' + S.codeBlock + '">' + codeHtml + '</code></pre>' +
          '</section>'
        );
        continue;
      }

      // 分割线
      if (/^([-*_])\s*\1\s*\1\s*$/.test(line)) { out.push('<hr style="' + S.hr + '">'); i++; continue; }

      // 引用
      if (/^>\s?/.test(line)) {
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
        const html = buf.map(function (l) { return inline(l, S, t, opts); }).join('<br>');
        out.push('<blockquote style="' + S.blockquote + '">' + html + '</blockquote>');
        continue;
      }

      // 表格
      if (/^\|/.test(line) && i + 1 < lines.length && /^\|/.test(lines[i + 1])) {
        const tlines = [];
        while (i < lines.length && /^\|/.test(lines[i])) { tlines.push(lines[i]); i++; }
        // 第二行须为对齐分隔行，否则按段落
        const secondCells = splitRow(tlines[1]);
        const isAlign = secondCells.length > 0 && secondCells.every(function (c) { return /^:?-{2,}:?$/.test(c.trim()); });
        if (tlines.length >= 2 && isAlign) {
          out.push(renderTable(tlines, S, t, opts));
        } else {
          out.push('<p style="' + S.p + '">' + inline(tlines.join(' '), S, t, opts) + '</p>');
        }
        continue;
      }

      // 列表
      const lm = matchListLine(line);
      if (lm) {
        const r = parseList(lines, i, S, t, opts);
        if (r.html) out.push(r.html);
        i = r.next;
        continue;
      }

      // 段落（收集至空行/块级起点）
      const buf = [];
      while (
        i < lines.length &&
        !/^\s*$/.test(lines[i]) &&
        !/^#{1,6}\s/.test(lines[i]) &&
        !/^```/.test(lines[i]) &&
        !/^>\s?/.test(lines[i]) &&
        !/^\|/.test(lines[i]) &&
        !matchListLine(lines[i]) &&
        !/^([-*_])\s*\1\s*\1\s*$/.test(lines[i])
      ) {
        buf.push(lines[i]); i++;
      }
      if (buf.length === 0) { i++; continue; }

      // 图注段落（斜体单段 → 居中 caption）
      if (buf.length === 1 && /^[*_](.+)[*_]$/.test(buf[0].trim()) && buf[0].trim().startsWith('图注')) {
        const c = buf[0].trim().replace(/^[*_]/, '').replace(/[*_]$/, '');
        out.push('<span style="' + S.caption + '">' + inline(c, S, t, opts) + '</span>');
        continue;
      }

      // 媒体占位（单段 [视频：x] / [音频：x] / 【配图：x.png】）
      const single = buf.length === 1 ? buf[0].trim() : '';
      const media = single ? isMediaPlaceholder(single) : null;
      if (media) {
        if (media.type === '配图') {
          const idx = ++opts._imgCounter.index;
          const fileName = media.title;
          const isHero = /引子|封面|hero/i.test(fileName);
          if (isHero && opts._heroInfo && opts._heroInfo.intro) {
            // 引子图占位卡：自动提取标题+引子文案，作为设计参考
            out.push('<div style="' + S.imgPlaceholder + ';border-color:' + t.main + ';border-width:2px;">' +
              '<div style="font-size:11px;font-weight:700;letter-spacing:1.5px;color:' + t.main + ';margin-bottom:10px;">★ 引子图 · 图片占位</div>' +
              '<div style="font-size:16px;font-weight:700;color:' + t.text + ';margin-bottom:8px;line-height:1.4;">' + esc(opts._heroInfo.title) + '</div>' +
              '<div style="font-size:13px;color:#666;margin-bottom:12px;line-height:1.7;text-align:left;">' + esc(opts._heroInfo.intro) + '</div>' +
              '<div style="font-size:11px;color:#b0b0b5;line-height:1.6;">文件名：' + esc(fileName) + '<br>建议尺寸 1080×600 · 公众号后台此处插入</div>' +
              '</div>');
          } else {
            // 普通配图占位卡
            out.push('<div style="' + S.imgPlaceholder + '">' +
              '<div style="font-size:11px;font-weight:600;letter-spacing:1px;color:' + t.main + ';margin-bottom:6px;">图 ' + idx + ' · 图片占位</div>' +
              '<div style="font-size:14px;font-weight:600;color:' + t.text + ';">' + esc(fileName) + '</div>' +
              '<div style="font-size:11px;color:#b0b0b5;margin-top:6px;">公众号后台此处插入图片 · 建议宽度 900px</div>' +
              '</div>');
          }
        } else {
          // 视频/音频占位
          const icon = media.type === '视频' ? '🎬' : '🎵';
          out.push('<div style="' + S.mediaCard + '">' + icon + ' ' + esc(media.type) + '插入位置：<b>' + esc(media.title) + '</b> <span style="font-size:12px;color:#b6bdc6;">（公众号后台此处插入）</span></div>');
        }
        continue;
      }

      // 普通段落：支持软换行（行尾 \ 或行尾双空格）
      const soft = [];
      buf.forEach(function (l, idx) {
        let ll = l;
        const isLast = idx === buf.length - 1;
        if (/\\$/.test(ll)) { ll = ll.replace(/\\$/, ''); soft.push(inline(ll, S, t, opts)); if (!isLast) soft.push('<br>'); }
        else if (/ {2}$/.test(ll)) { ll = ll.replace(/ {2}$/, ''); soft.push(inline(ll, S, t, opts)); if (!isLast) soft.push('<br>'); }
        else { soft.push(inline(ll, S, t, opts)); }
      });
      out.push('<p style="' + S.p + '">' + soft.join('') + '</p>');
    }

    let section = '<section style="' + S.wrapper + '">' + out.join('\n');

    // footer（文末声明区小字）
    if (footerText) {
      const fl = footerText.split('\n').filter(function (l) { return l.trim(); });
      const fh = fl.map(function (l) { return inline(l, S, t, opts); }).join('<br>');
      section += '\n<div style="margin-top:36px;padding-top:14px;border-top:1px dashed #d5dae0;' + S.footer + '">' + fh + '</div>';
    }
    section += '</section>';

    return { html: section, title: title, theme: tid, main: t.main };
  }

  /* ==================== 插件化 API（AI 友好） ==================== */

  // 外部注册新主题（高内聚：纯 JSON 配置；低耦合：不修改引擎核心）
  function registerTheme(id, config) {
    if (!id || typeof id !== 'string') throw new Error('registerTheme: id (string) required');
    if (!config || typeof config !== 'object') throw new Error('registerTheme: config (object) required');
    if (!config.main) throw new Error('registerTheme: config.main (hex color) required');
    THEMES[id] = Object.assign({
      name: id, group: '自定义', main: '#056DE8',
      h2: 'bar', h3: 'line', quote: 'soft', pre: 'dark', dot: config.main,
      desc: '自定义主题'
    }, config);
    return { ok: true, id: id, theme: THEMES[id] };
  }

  // 读取主题配置（含别名解析）
  function getTheme(id) {
    const resolvedId = THEME_ALIASES[id] || id;
    return THEMES[resolvedId] ? Object.assign({}, THEMES[resolvedId], { id: resolvedId }) : null;
  }

  // 导出主题配置为 JSON（便于分享/备份）
  function exportTheme(id) {
    const t = getTheme(id);
    if (!t) return null;
    const result = {};
    ['name', 'group', 'main', 'h2', 'h3', 'quote', 'pre', 'dot', 'text', 'soft', 'codeText', 'codeBg', 'desc'].forEach(function (k) {
      if (t[k] !== undefined) result[k] = t[k];
    });
    return result;
  }

  // 列出所有主题（按分组，便于 AI 选择）
  function listThemes() {
    const groups = {};
    Object.keys(THEMES).forEach(function (id) {
      const t = THEMES[id];
      if (!groups[t.group]) groups[t.group] = [];
      groups[t.group].push({ id: id, name: t.name, main: t.main, desc: t.desc });
    });
    return groups;
  }

  // 结构化 JSON 输出（便于 AI 解析 / Playwright 自动化接入）
  function renderToJSON(md, opts) {
    const r = render(md, opts);
    return {
      ok: true,
      title: r.title,
      theme: r.theme,
      mainColor: r.main,
      wordCount: countWords(r.html),
      html: r.html,
      meta: {
        engineVersion: '2.2.2',
        generatedAt: new Date().toISOString(),
        inputLength: md.length,
        outputLength: r.html.length
      }
    };
  }

  /* ==================== 字数统计 ==================== */

  function countWords(html) {
    const text = html
      .replace(/<[^>]+>/g, '')
      .replace(/&nbsp;/g, ' ')
      .replace(/&amp;/g, '&')
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&quot;/g, '"')
      .replace(/\s+/g, '');
    return text.length; // 中英混排近似字数
  }

  return {
    version: '2.2.2',
    render: render,
    renderToJSON: renderToJSON,
    themes: THEMES,
    themeKeys: Object.keys(THEMES),
    themeAliases: THEME_ALIASES,
    registerTheme: registerTheme,
    getTheme: getTheme,
    listThemes: listThemes,
    exportTheme: exportTheme,
    countWords: countWords,
    themeTokens: themeTokens,
  };
});

</script>
<script>
'use strict';
const S = XingTuMd;
const $ = id => document.getElementById(id);
const editor = $('editor');
const content = $('content');
let currentTheme = 'byte';
let customColor = null;
let isWide = false;
const GROUPS = ['科技实战', '观点随笔', '成长故事'];

/* ---------- 主题面板 ---------- */
function buildThemePanel() {
  const gmap = {};
  S.themeKeys.forEach(k => { const t = S.themes[k]; (gmap[t.group] = gmap[t.group] || []).push(k); });
  let html = '';
  GROUPS.forEach(g => {
    if (!gmap[g]) return;
    html += '<div class="tp-group"><div class="tp-group-name">' + g + '</div><div class="tp-list">';
    gmap[g].forEach(k => {
      const t = S.themes[k];
      html += '<button class="tp-item" data-k="' + k + '" onclick="pickTheme(\'' + k + '\')">' +
        '<span class="dot" style="background:' + t.main + '"></span><span>' + t.name +
        '<span class="tp-desc">' + t.desc + '</span></span></button>';
    });
    html += '</div></div>';
  });
  $('tpBody').innerHTML = html;
}

function pickTheme(k) {
  currentTheme = k;
  customColor = null;
  $('customColor').value = S.themes[k].main;
  $('customColorValue').textContent = S.themes[k].main;
  syncThemeUI(); renderPreview();
}

/* ---------- 主题色系联动 ---------- */
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const num = parseInt(full, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}
function adjustColor(hex, amount) {
  const { r, g, b } = hexToRgb(hex);
  const nr = Math.min(255, Math.max(0, r + amount));
  const ng = Math.min(255, Math.max(0, g + amount));
  const nb = Math.min(255, Math.max(0, b + amount));
  return '#' + ((1 << 24) + (nr << 16) + (ng << 8) + nb).toString(16).slice(1);
}
function rgba(hex, alpha) {
  const { r, g, b } = hexToRgb(hex);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}
function updateThemeColors(main) {
  const root = document.documentElement;
  root.style.setProperty('--main', main);
  root.style.setProperty('--main-light', adjustColor(main, 40));
  root.style.setProperty('--main-dark', adjustColor(main, -40));
  root.style.setProperty('--main-bg', rgba(main, 0.08));
  root.style.setProperty('--main-bg-focus', rgba(main, 0.12));
  root.style.setProperty('--main-shadow', rgba(main, 0.25));
  root.style.setProperty('--main-shadow-hover', rgba(main, 0.35));
  root.style.setProperty('--main-shadow-logo', rgba(main, 0.30));
}

function syncThemeUI() {
  const t = S.themes[currentTheme];
  const main = customColor || t.main;
  updateThemeColors(main);
  if (!customColor) {
    $('customColor').value = t.main;
    $('customColorValue').textContent = t.main;
  }
  $('themeBtnText').textContent = t.name;
  $('statTheme').textContent = currentTheme + ' · ' + t.name + ' · ' + main;
  document.querySelectorAll('.tp-item').forEach(el => el.classList.toggle('active', el.dataset.k === currentTheme));
}

function applyCustomColor(v) {
  customColor = v;
  $('customColorValue').textContent = v;
  document.querySelectorAll('.tp-item').forEach(el => el.classList.remove('active'));
  syncThemeUI(); renderPreview();
}

function resetColor() {
  const t = S.themes[currentTheme];
  $('customColor').value = t.main; $('customColorValue').textContent = t.main;
  customColor = null; syncThemeUI(); renderPreview();
}

function toggleThemePop(e) {
  e && e.stopPropagation();
  $('checkPop').classList.remove('show');
  $('themePop').classList.toggle('show');
}

/* ---------- 发布检查 ---------- */
function toggleCheckPop(e) {
  e && e.stopPropagation();
  $('themePop').classList.remove('show');
  $('checkPop').classList.toggle('show');
  if ($('checkPop').classList.contains('show')) updateChecklist();
}

function updateChecklist() {
  const title = $('titleIn').value.trim();
  const md = editor.value;
  const res = S.render(md, { theme: currentTheme, color: customColor || undefined, title: title || undefined, footer: $('optFooter').checked });
  const words = S.countWords(res.html);
  const imgCount = (res.html.match(/图片占位/g) || []).length;

  const items = [
    {
      icon: title ? 'check' : 'warning',
      color: title ? 'var(--success)' : 'var(--warning)',
      label: '文章标题',
      desc: title ? '已填写' : '尚未填写（建议 15-30 字，含核心关键词）',
      value: title ? title.substring(0, 20) + (title.length > 20 ? '...' : '') : '',
      valueClass: title ? 'ok' : 'warn'
    },
    {
      icon: words >= 1000 ? 'check' : (words > 0 ? 'info' : 'warning'),
      color: words >= 1000 ? 'var(--success)' : (words > 0 ? 'var(--main)' : 'var(--warning)'),
      label: '正文字数',
      desc: words >= 1000 ? '字数充足' : (words > 0 ? '字数偏少，建议 1500-5000 字' : '正文为空'),
      value: words.toLocaleString() + ' 字',
      valueClass: words >= 1000 ? 'ok' : (words > 0 ? 'info' : 'warn')
    },
    {
      icon: imgCount > 0 ? 'warning' : 'info',
      color: imgCount > 0 ? 'var(--warning)' : 'var(--main)',
      label: '图片数量',
      desc: imgCount > 0 ? '需在公众号后台手动上传 ' + imgCount + ' 张图片' : '无图片（纯文字）',
      value: imgCount + ' 张占位',

/* ---------- 渲染 ---------- */
function renderPreview() {
  const md = editor.value;
  const res = S.render(md, {
    theme: currentTheme,
    color: customColor || undefined,
    title: $('titleIn').value || undefined,
    footer: $('optFooter').checked,
    images: $('optImages').value,
    links: $('optLinks').value,
  });
  $('phTitle').textContent = res.title || '（未命名 · 请在顶部填公众号标题）';
  content.innerHTML = res.html || '<div class="preview-empty">在左侧输入 Markdown，这里实时预览</div>';
  const words = S.countWords(res.html);
  const imgCount = (res.html.match(/图片占位/g) || []).length;
  $('statWords').textContent = words.toLocaleString() + ' 字' + (words > 18000 ? ' · 超长' : '');
  $('statBlocks').textContent = '主题渲染 · ' + S.themes[res.theme].name;
  if (imgCount > 0) {
    $('statImages').style.display = 'inline';
    $('statImages').textContent = imgCount + ' 图待上传';
  } else {
    $('statImages').style.display = 'none';
  }
  if ($('checkPop').classList.contains('show')) updateChecklist();

/* ---------- 复制（富文本） ---------- */
function copyToClipboard() {
  const range = document.createRange();
  range.selectNodeContents(content);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  sel.removeAllRanges();
  if (ok) {
    const words = S.countWords(content.innerHTML);
    toast('已复制 ' + words.toLocaleString() + ' 字正文，去公众号编辑器粘贴');
  } else {
    toast('自动复制失败，请手动全选正文后按 Ctrl+C');

}
function toast(msg) {
  const t = $('toast'); t.textContent = msg;
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 主题导入/导出 ---------- */
function exportTheme() {
  const config = S.exportTheme(currentTheme);
  config.id = currentTheme;
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'md2wechat-theme-' + currentTheme + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('主题已导出：' + currentTheme);
}

function importTheme() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      try {
        const config = JSON.parse(ev.target.result);
        if (!config.main) throw new Error('缺少 main 字段');
        const id = config.id || ('custom_' + Date.now());
        delete config.id;
        S.registerTheme(id, config);
        currentTheme = id;
        buildThemePanel();
        syncThemeUI();
        renderPreview();
        toast('主题已导入：' + (config.name || id));
      } catch (err) {
        toast('导入失败：' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

editor.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(renderPreview, 120); });
