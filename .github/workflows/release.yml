name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 打包单文件工作台
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "❌ tag v$TAG 与 package.json v$PKG 不一致"
            exit 1
          fi
          echo "✅ 版本一致：v$PKG"

      - name: npm test
        run: npm test

      - name: 构建单文件工作台
        run: node tools/build-app.js

      - name: 上传 index.html（单文件交付物）
        uses: actions/upload-artifact@v4
        with:
          name: mopai-index-html
          path: index.html
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: index.html
          generate_release_notes: true
