name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 零依赖校验
        run: |
          node -e "
            const pkg = require('./package.json');
            if (pkg.dependencies) { console.error('❌ package.json 存在 dependencies，违反零依赖红线'); process.exit(1); }
            if (pkg.devDependencies) { console.error('❌ package.json 存在 devDependencies，违反零依赖红线'); process.exit(1); }
            console.log('✅ 零依赖校验通过');
          "

      - name: 版本一致性校验
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            const eng = require('./lib/engine.js');
            if (pkg.version !== eng.version) { console.error('❌ package.json (' + pkg.version + ') 与 engine (' + eng.version + ') 版本不一致'); process.exit(1); }
            const readme = fs.readFileSync('./README.md', 'utf-8');
            const m = readme.match(/badge\/version-v([\d.]+)-blue/);
            if (!m || m[1] !== pkg.version) { console.error('❌ README badge 版本 (' + (m && m[1]) + ') 与 package.json (' + pkg.version + ') 不一致'); process.exit(1); }
            console.log('✅ 版本一致：v' + pkg.version);
          "

      - name: npm test
        run: npm test

      - name: CLI smoke（examples/demo.md → 公众号 HTML）
        run: |
          node bin/md2wechat.js examples/demo.md --theme editorial -o /tmp/demo.html
          node bin/md2wechat.js examples/demo.md --stdout | head -c 200
          echo ""
          node bin/md2wechat.js examples/demo.md --check
          node bin/md2wechat.js examples/demo.md --summary
          node bin/md2wechat.js examples/demo.md --variant zhihu --stdout | head -c 200
          echo ""
          test -s /tmp/demo.html && echo "✅ CLI smoke 通过"

      - name: 工作台构建 smoke
        run: |
          node tools/build-app.js
          node -e "
            const fs = require('fs');
            const s = fs.readFileSync('./index.html', 'utf-8');
            if (!s.includes('</html>')) { console.error('❌ index.html 结构不完整'); process.exit(1); }
            console.log('✅ index.html 构建产物完整 (' + (s.length / 1024).toFixed(1) + ' KB)');
          "
