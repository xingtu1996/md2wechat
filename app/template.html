<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行途排版 · md2wechat v2.2</title>
<style>
:root{
  --main:#056DE8;
  --main-light:#0099ff;
  --main-dark:#0052b3;
  --main-bg:rgba(5,109,232,0.08);
  --main-bg-focus:rgba(5,109,232,0.12);
  --main-shadow:rgba(5,109,232,0.25);
  --main-shadow-hover:rgba(5,109,232,0.35);
  --main-shadow-logo:rgba(5,109,232,0.30);
  --bg:#f5f5f7;
  --panel:rgba(255,255,255,0.72);
  --panel-solid:#ffffff;
  --ink:#1d1d1f;
  --mut:#86868b;
  --line:rgba(0,0,0,0.08);
  --hover:rgba(0,0,0,0.04);
  --success:#34c759;
  --warning:#ff9500;
  --danger:#ff3b30;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
select,input{font-family:inherit}
svg{display:block;flex-shrink:0}

/* ============ 顶栏（毛玻璃） ============ */
.topbar{
  height:52px;
  background:var(--panel);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
  padding:0 20px;
  position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.2px}
.brand .logo{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--main),var(--main-light));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 2px 8px var(--main-shadow-logo);
}
.brand small{color:var(--mut);font-weight:500;font-size:11px;margin-left:2px}
.title-in{
  flex:1;max-width:300px;min-width:120px;
  border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;font-size:13px;outline:none;
  background:rgba(255,255,255,0.8);
  transition:border-color .2s,box-shadow .2s;
}
.title-in:focus{border-color:var(--main);box-shadow:0 0 0 3px var(--main-bg-focus)}
.spacer{flex:1}
.icon-btn{
  display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:rgba(255,255,255,0.8);
  border-radius:10px;padding:7px 12px;font-size:13px;color:#444;
  transition:all .15s;
}
.icon-btn:hover{background:#fff;border-color:rgba(0,0,0,0.15)}
.icon-btn.active{border-color:var(--main);color:var(--main);background:var(--main-bg)}
.copy-btn{
  display:flex;align-items:center;gap:7px;
  border:none;border-radius:10px;padding:8px 18px;
  font-size:13.5px;font-weight:600;
  background:var(--main);color:#fff;
  box-shadow:0 2px 8px var(--main-shadow);
  transition:all .15s;
}
.copy-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--main-shadow-hover)}
.copy-btn:active{transform:translateY(0)}
.copy-btn .kbd{
  font-size:10px;background:rgba(255,255,255,.2);
  padding:2px 6px;border-radius:4px;font-weight:500;
}

/* ============ 主体 ============ */
.main{display:grid;grid-template-columns:1fr 1fr;height:calc(100% - 52px);gap:0}
.pane{display:flex;flex-direction:column;min-width:0}
.editor-pane{border-right:1px solid var(--line);background:var(--panel-solid)}
.pane-head{
  height:36px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:11px;color:var(--mut);font-weight:500;
  letter-spacing:.3px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,0.5);
}
.pane-head .hint{color:#b0b0b5;font-weight:400}
.tool-mini{display:flex;gap:4px}
.tool-mini button{
  display:flex;align-items:center;gap:5px;
  background:transparent;border:none;color:var(--mut);
  border-radius:6px;padding:4px 10px;font-size:11px;
  transition:all .15s;
}
.tool-mini button:hover{background:var(--hover);color:var(--ink)}
#editor{
  flex:1;border:none;outline:none;resize:none;
  background:transparent;color:var(--ink);
  font-family:"SF Mono",Menlo,Monaco,Consolas,"Courier New",monospace;
  font-size:13px;line-height:1.75;padding:18px 20px;tab-size:2;
}
.pane-status{
  height:28px;border-top:1px solid var(--line);
  color:var(--mut);font-size:11px;
  display:flex;align-items:center;padding:0 16px;gap:14px;
  background:rgba(255,255,255,0.5);
}

/* 预览侧 */
.preview-pane{
  background:var(--bg);
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:32px 24px 80px;
}
.preview-inner{width:100%;max-width:460px;margin:0 auto}
.phone{
  width:100%;background:#fff;
  border-radius:18px;
  box-shadow:0 4px 24px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  overflow:hidden;
  border:1px solid rgba(0,0,0,0.04);
}
.phone .ph-title{padding:22px 24px 4px;font-size:17px;font-weight:700;line-height:1.5;text-align:center;color:var(--ink);letter-spacing:-.2px}
.phone .ph-meta{display:flex;align-items:center;gap:8px;padding:10px 24px 16px;justify-content:center}
.phone .ph-meta .avatar{
  width:20px;height:20px;border-radius:50%;
  background:linear-gradient(135deg,var(--main),var(--main-light));
  flex-shrink:0;
}
.phone .ph-meta .author{font-size:11px;color:var(--mut)}
.phone .ph-body{padding:10px 24px 44px;border-top:1px solid #f5f5f7}
#content{min-height:120px}
.preview-empty{color:var(--mut);text-align:center;padding:60px 20px;font-size:14px}

/* 宽屏模式 */
.preview-pane.wide .preview-inner{max-width:780px}
.preview-pane.wide .phone .ph-title{text-align:left}
.preview-pane.wide .phone .ph-meta{justify-content:flex-start;padding-left:28px}

/* ============ 弹出面板（毛玻璃） ============ */
.pop{
  position:absolute;top:58px;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  padding:16px;
  display:none;z-index:40;
  max-height:calc(100vh - 80px);
  overflow-y:auto;
  overflow-x:hidden;
}
.pop::-webkit-scrollbar{width:6px}
.pop::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:3px}
.pop::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.25)}
.pop.show{display:block}
.pop-title{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--ink);display:flex;align-items:center;gap:8px}
.tp-group{margin-bottom:12px}
.tp-group-name{font-size:10px;color:var(--mut);font-weight:600;letter-spacing:1px;margin-bottom:7px;text-transform:uppercase}
.tp-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tp-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,0.6);
  font-size:12.5px;font-weight:500;text-align:left;
  transition:all .15s;color:var(--ink);
}
.tp-item:hover{border-color:rgba(0,0,0,0.15);background:#fff}
.tp-item.active{border-color:var(--main);background:var(--main-bg);color:var(--main)}
.tp-item .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tp-item .tp-desc{font-size:10px;color:var(--mut);font-weight:400;display:block;line-height:1.3;margin-top:1px}
.tp-adv{
  border-top:1px dashed var(--line);
  margin-top:8px;padding-top:12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.tp-adv label{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px}
.tp-adv select{
  border:1px solid var(--line);border-radius:7px;
  padding:4px 6px;font-size:11px;background:rgba(255,255,255,0.8);
  outline:none;
}
.color-box{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);border-radius:8px;
  padding:3px 10px;font-size:11px;background:rgba(255,255,255,0.8);
}
.color-box input[type=color]{width:20px;height:20px;border:none;background:none;padding:0;cursor:pointer;border-radius:4px}
#customColorValue{font-family:"SF Mono",Menlo,monospace;color:var(--mut);min-width:62px}
.tp-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.tp-actions button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid var(--line);background:rgba(255,255,255,0.6);
  border-radius:8px;padding:6px 10px;font-size:11px;color:var(--ink);
  transition:all .15s;
}
.tp-actions button:hover{background:#fff;border-color:rgba(0,0,0,0.15)}

/* ============ 发布检查清单 ============ */
.checklist{width:320px;right:20px}
.check-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--line);
}
.check-item:last-child{border-bottom:none}
.check-icon{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.check-content{flex:1;min-width:0}
.check-label{font-size:12.5px;font-weight:600;color:var(--ink)}
.check-desc{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.4}
.check-value{font-size:11px;font-weight:600;font-family:"SF Mono",Menlo,monospace;margin-top:2px}
.check-value.ok{color:var(--success)}
.check-value.warn{color:var(--warning)}
.check-value.info{color:var(--main)}
.check-footer{
  margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
  font-size:11px;color:var(--mut);line-height:1.5;
}
.check-footer strong{color:var(--ink)}

/* ============ Toast ============ */
.toast{
  position:fixed;bottom:32px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:rgba(29,29,31,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  color:#fff;font-size:13px;
  padding:12px 24px;border-radius:14px;
  box-shadow:0 8px 32px rgba(0,0,0,.2);
  transition:all .3s cubic-bezier(.4,0,.2,1);
  opacity:0;z-index:60;
  font-weight:500;
  display:flex;align-items:center;gap:8px;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* 滚动条美化 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.25)}

@media(max-width:980px){
  .main{grid-template-columns:1fr;overflow:auto}
  .editor-pane{min-height:45vh;border-right:none;border-bottom:1px solid var(--line)}
  .pop{right:16px;width:min(380px,calc(100vw - 32px))}
  .topbar .title-in{display:none}
  .icon-btn .btn-text{display:none}
}
</style>
</head>

<div class="topbar">
  <div class="brand">
    <div class="logo">途</div>
    行途排版
    <small>md2wechat v2.2</small>
  </div>
  <input class="title-in" id="titleIn" placeholder="文章标题（公众号标题单独填）">

  <button class="icon-btn" id="themeBtn" onclick="toggleThemePop(event)">
    <svg width="15" height="15"><use href="#icon-palette"/></svg>
    <span class="btn-text" id="themeBtnText">行途蓝</span>

  </button>

  <button class="icon-btn" id="checkBtn" onclick="toggleCheckPop(event)">
    <svg width="15" height="15"><use href="#icon-checklist"/></svg>
    <span class="btn-text">发布检查</span>
  </button>

  <button class="copy-btn" onclick="copyToClipboard()">
    <svg width="15" height="15"><use href="#icon-copy"/></svg>
    复制到公众号
    <span class="kbd">⌘↵</span>
  </button>
</div>

<!-- 主题面板 -->
<div class="pop" id="themePop" style="right:280px;width:380px">

    <svg width="15" height="15"><use href="#icon-palette"/></svg>
    选择主题
  </div>
  <div id="tpBody"></div>
  <div class="tp-adv">
    <label>正文图片
      <select id="optImages" onchange="renderPreview()">
        <option value="placeholder" title="输出占位卡，在公众号后台手动上传（最稳妥，支持本地图片）">占位卡（推荐）</option>
        <option value="keep" title="输出真实 img 标签，http(s) 外链图公众号会自动上传到素材库；本地路径不支持">外链自动上传</option>
        <option value="drop">忽略</option>
      </select>

      <select id="optLinks" onchange="renderPreview()">

      <svg width="13" height="13"><use href="#icon-upload"/></svg>

<script>
'use strict';
const S = XingTuMd;
const $ = id => document.getElementById(id);
const editor = $('editor');
const content = $('content');
let currentTheme = 'byte';
let customColor = null;
let isWide = false;
const GROUPS = ['科技实战', '观点随笔', '成长故事'];

/* ---------- 主题面板 ---------- */
function buildThemePanel() {
  const gmap = {};
  S.themeKeys.forEach(k => { const t = S.themes[k]; (gmap[t.group] = gmap[t.group] || []).push(k); });
  let html = '';
  GROUPS.forEach(g => {
    if (!gmap[g]) return;
    html += '<div class="tp-group"><div class="tp-group-name">' + g + '</div><div class="tp-list">';
    gmap[g].forEach(k => {
      const t = S.themes[k];
      html += '<button class="tp-item" data-k="' + k + '" onclick="pickTheme(\'' + k + '\')">' +
        '<span class="dot" style="background:' + t.main + '"></span><span>' + t.name +
        '<span class="tp-desc">' + t.desc + '</span></span></button>';
    });
    html += '</div></div>';
  });
  $('tpBody').innerHTML = html;
}

function pickTheme(k) {
  currentTheme = k;
  customColor = null;
  $('customColor').value = S.themes[k].main;
  $('customColorValue').textContent = S.themes[k].main;
  syncThemeUI(); renderPreview();
}

/* ---------- 主题色系联动 ---------- */
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const num = parseInt(full, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}
function adjustColor(hex, amount) {
  const { r, g, b } = hexToRgb(hex);
  const nr = Math.min(255, Math.max(0, r + amount));
  const ng = Math.min(255, Math.max(0, g + amount));
  const nb = Math.min(255, Math.max(0, b + amount));
  return '#' + ((1 << 24) + (nr << 16) + (ng << 8) + nb).toString(16).slice(1);
}
function rgba(hex, alpha) {
  const { r, g, b } = hexToRgb(hex);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}
function updateThemeColors(main) {
  const root = document.documentElement;
  root.style.setProperty('--main', main);
  root.style.setProperty('--main-light', adjustColor(main, 40));
  root.style.setProperty('--main-dark', adjustColor(main, -40));
  root.style.setProperty('--main-bg', rgba(main, 0.08));
  root.style.setProperty('--main-bg-focus', rgba(main, 0.12));
  root.style.setProperty('--main-shadow', rgba(main, 0.25));
  root.style.setProperty('--main-shadow-hover', rgba(main, 0.35));
  root.style.setProperty('--main-shadow-logo', rgba(main, 0.30));
}

function syncThemeUI() {
  const t = S.themes[currentTheme];
  const main = customColor || t.main;
  updateThemeColors(main);
  if (!customColor) {
    $('customColor').value = t.main;
    $('customColorValue').textContent = t.main;
  }
  $('themeBtnText').textContent = t.name;
  $('statTheme').textContent = currentTheme + ' · ' + t.name + ' · ' + main;
  document.querySelectorAll('.tp-item').forEach(el => el.classList.toggle('active', el.dataset.k === currentTheme));
}

function applyCustomColor(v) {
  customColor = v;
  $('customColorValue').textContent = v;
  document.querySelectorAll('.tp-item').forEach(el => el.classList.remove('active'));
  syncThemeUI(); renderPreview();
}

function resetColor() {
  const t = S.themes[currentTheme];
  $('customColor').value = t.main; $('customColorValue').textContent = t.main;
  customColor = null; syncThemeUI(); renderPreview();
}

function toggleThemePop(e) {
  e && e.stopPropagation();
  $('checkPop').classList.remove('show');
  $('themePop').classList.toggle('show');
}

/* ---------- 发布检查 ---------- */
function toggleCheckPop(e) {
  e && e.stopPropagation();
  $('themePop').classList.remove('show');
  $('checkPop').classList.toggle('show');
  if ($('checkPop').classList.contains('show')) updateChecklist();
}

function updateChecklist() {
  const title = $('titleIn').value.trim();
  const md = editor.value;
  const res = S.render(md, { theme: currentTheme, color: customColor || undefined, title: title || undefined, footer: $('optFooter').checked });
  const words = S.countWords(res.html);
  const imgCount = (res.html.match(/图片占位/g) || []).length;

  const items = [
    {
      icon: title ? 'check' : 'warning',
      color: title ? 'var(--success)' : 'var(--warning)',
      label: '文章标题',
      desc: title ? '已填写' : '尚未填写（建议 15-30 字，含核心关键词）',
      value: title ? title.substring(0, 20) + (title.length > 20 ? '...' : '') : '',
      valueClass: title ? 'ok' : 'warn'
    },
    {
      icon: words >= 1000 ? 'check' : (words > 0 ? 'info' : 'warning'),
      color: words >= 1000 ? 'var(--success)' : (words > 0 ? 'var(--main)' : 'var(--warning)'),
      label: '正文字数',
      desc: words >= 1000 ? '字数充足' : (words > 0 ? '字数偏少，建议 1500-5000 字' : '正文为空'),
      value: words.toLocaleString() + ' 字',
      valueClass: words >= 1000 ? 'ok' : (words > 0 ? 'info' : 'warn')
    },
    {
      icon: imgCount > 0 ? 'warning' : 'info',
      color: imgCount > 0 ? 'var(--warning)' : 'var(--main)',
      label: '图片数量',
      desc: imgCount > 0 ? '需在公众号后台手动上传 ' + imgCount + ' 张图片' : '无图片（纯文字）',
      value: imgCount + ' 张占位',
      valueClass: imgCount > 0 ? 'warn' : 'info'
    },
    {
      icon: 'info',
      color: 'var(--main)',
      label: '摘要（公众号后台）',
      desc: '请在公众号后台填写，建议 50-120 字，堆叠 2-5 个核心搜索词'
    },
    {
      icon: 'info',
      color: 'var(--main)',
      label: '封面（公众号后台）',
      desc: '请上传封面图，建议尺寸 900×383（2.35:1）'
    },
    {
      icon: 'info',
      color: 'var(--main)',
      label: '原创声明（公众号后台）',
      desc: '首发文章建议开启原创声明，保护内容权益'
    }
  ];

  let html = '';
  items.forEach(item => {
    html += '<div class="check-item">' +
      '<svg class="check-icon" style="color:' + item.color + '"><use href="#icon-' + item.icon + '"/></svg>' +
      '<div class="check-content">' +
      '<div class="check-label">' + item.label + '</div>' +
      '<div class="check-desc">' + item.desc + '</div>' +
      (item.value ? '<div class="check-value ' + (item.valueClass || '') + '">' + item.value + '</div>' : '') +
      '</div></div>';
  });
  $('checkBody').innerHTML = html;
}

/* ---------- 视图切换 ---------- */
function toggleView() {
  isWide = !isWide;
  $('previewPane').classList.toggle('wide', isWide);
  $('viewBtnText').textContent = isWide ? '宽屏预览' : '手机预览';
  $('viewIcon').innerHTML = '<use href="#icon-' + (isWide ? 'monitor' : 'smartphone') + '"/>';
  $('viewBtn').classList.toggle('active', !isWide);
}

/* ---------- 渲染 ---------- */
function renderPreview() {
  const md = editor.value;
  const res = S.render(md, {
    theme: currentTheme,
    color: customColor || undefined,
    title: $('titleIn').value || undefined,
    footer: $('optFooter').checked,
    images: $('optImages').value,
    links: $('optLinks').value,
  });
  $('phTitle').textContent = res.title || '（未命名 · 请在顶部填公众号标题）';
  content.innerHTML = res.html || '<div class="preview-empty">在左侧输入 Markdown，这里实时预览</div>';
  const words = S.countWords(res.html);
  const imgCount = (res.html.match(/图片占位/g) || []).length;
  $('statWords').textContent = words.toLocaleString() + ' 字' + (words > 18000 ? ' · 超长' : '');
  $('statBlocks').textContent = '主题渲染 · ' + S.themes[res.theme].name;
  if (imgCount > 0) {
    $('statImages').style.display = 'inline';
    $('statImages').textContent = imgCount + ' 图待上传';
  } else {
    $('statImages').style.display = 'none';
  }
  if ($('checkPop').classList.contains('show')) updateChecklist();
}

/* ---------- 复制（富文本） ---------- */
function copyToClipboard() {
  const range = document.createRange();
  range.selectNodeContents(content);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  sel.removeAllRanges();
  if (ok) {
    const words = S.countWords(content.innerHTML);
    toast('已复制 ' + words.toLocaleString() + ' 字正文，去公众号编辑器粘贴');
  } else {
    toast('自动复制失败，请手动全选正文后按 Ctrl+C');
  }
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg;
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 主题导入/导出 ---------- */
function exportTheme() {
  const config = S.exportTheme(currentTheme);
  config.id = currentTheme;
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'md2wechat-theme-' + currentTheme + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('主题已导出：' + currentTheme);
}

function importTheme() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = function (e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      try {
        const config = JSON.parse(ev.target.result);
        if (!config.main) throw new Error('缺少 main 字段');
        const id = config.id || ('custom_' + Date.now());
        delete config.id;
        S.registerTheme(id, config);
        currentTheme = id;
        buildThemePanel();
        syncThemeUI();
        renderPreview();
        toast('主题已导入：' + (config.name || id));
      } catch (err) {
        toast('导入失败：' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ---------- 编辑器 ---------- */
let timer = null;
editor.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(renderPreview, 120); });
$('titleIn').addEventListener('input', renderPreview);
function clearAll() { editor.value = ''; renderPreview(); }

有人问我，你写这些有人看吗？

## 三、天亮了

凌晨五点，天开始亮了。

我喝完最后一口豆浆，走出便利店。街上已经有了早起的人，卖早餐的推车冒着热气，环卫工人在扫街。

新的一天开始了。

而那盏便利店的灯，还亮着。

  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    copyToClipboard();

});

/* ---------- 点击外部关闭弹出面板 ---------- */
document.addEventListener('click', e => {
  if (!$('themePop').contains(e.target) && !$('themeBtn').contains(e.target)) $('themePop').classList.remove('show');
  if (!$('checkPop').contains(e.target) && !$('checkBtn').contains(e.target)) $('checkPop').classList.remove('show');
});
